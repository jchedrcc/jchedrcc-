<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="assets/img/Aspiration Logo.png">
  <title>Aspiration Publishing Trust - Admin Console</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/css/styles.css" rel="stylesheet">
  <style>
    /* Immersive Google-Inspired Canvas Background Layout */
    body {
      background: linear-gradient(135deg, #f1f3f4 0%, #e8eaed 50%, #dadce0 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #202124;
      font-family: 'Roboto', 'Segoe UI', arial, sans-serif;
      padding: 20px;
    }

    /* Polished Frosted Glass Container Module */
    .admin-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(8px);
      border-radius: 12px;
      max-width: 420px;
      width: 100%;
      border: 1px solid rgba(255, 255, 255, 0.7);
      box-shadow: 0 4px 24px rgba(32, 33, 36, 0.08), 0 1px 2px rgba(0, 0, 0, 0.05);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    /* Form Fields Styling */
    .form-control-custom {
      border: 1px solid #dadce0;
      border-radius: 6px;
      padding: 10px 14px;
      font-size: 0.95rem;
      background-color: #fff;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .form-control-custom:focus {
      border-color: #1a73e8;
      box-shadow: 0 0 0 3px rgba(26, 115, 232, 0.15);
      outline: none;
    }

    /* Google Accent Action Button Look */
    .btn-google-primary {
      background-color: #1a73e8;
      color: #ffffff;
      font-weight: 500;
      letter-spacing: 0.25px;
      border: none;
      border-radius: 6px;
      padding: 10px 24px;
      transition: background-color 0.2s, box-shadow 0.2s;
    }
    .btn-google-primary:hover {
      background-color: #1557b0;
      box-shadow: 0 1px 3px rgba(60,64,67,0.3), 0 4px 8px 3px rgba(60,64,67,0.15);
    }
  </style>
</head>

<body>

  <!-- Core Container Area -->
  <main class="w-100 d-flex flex-column align-items-center">
    
    <!-- Central Corporate Brand Identity Layout -->
    <div class="text-center mb-4 px-2">
      <div class="d-flex align-items-center justify-content-center mb-2">
     <div class="d-flex align-items-center justify-content-center gap-2 mb-2">
      <h1 class="m-0 fw-bold text-dark" style="font-size: 1.65rem; letter-spacing: -0.5px;">Aspiration Publishing Trust</h1>
      </div>
      </div>
      <div class="small fw-medium text-secondary" style="letter-spacing: 0.2px;">We Promote Research & Education in Fundamental Science and Technology</div>
    </div>

    <!-- Administrative Sign In Interface Box Look -->
    <div class="card admin-card p-4 p-sm-5">
      <div class="text-center mb-4">
        <h5 class="fw-normal text-dark m-0" style="font-size: 1.4rem;">Sign in</h5>
        <p class="text-muted small mt-1">to access your administrative portal console</p>
      </div>
      
      <div id="adminDropdownContent">
        <form onsubmit="event.preventDefault(); verifyAdminContent();">
          <div class="mb-3">
            <label for="adminAuthUser" class="form-label small fw-bold text-secondary mb-1">Username</label>
            <input type="text" class="form-control form-control-custom w-100" id="adminAuthUser" placeholder="Enter Username" required>
          </div>
          <div class="mb-4">
            <label for="adminAuthPwd" class="form-label small fw-bold text-secondary mb-1">Password</label>
            <input type="password" class="form-control form-control-custom w-100" id="adminAuthPwd" placeholder="Enter Password" required>
            <div id="adminAuthError" class="text-danger small fw-semibold mt-2" style="display: none;">❌ Invalid Username or Password</div>
          </div>
          <button type="submit" class="btn btn-google-primary w-100 fw-bold shadow-sm">Next</button>
        </form>
      </div>
    </div>

  </main>

  <script>
    // Verification Logic for Username & Password matching "abc"
    function verifyAdminContent() {
      const usernameInput = document.getElementById('adminAuthUser').value;
      const passwordInput = document.getElementById('adminAuthPwd').value;
      const errorDiv = document.getElementById('adminAuthError');
      const dropdownContent = document.getElementById('adminDropdownContent');
      
      if (usernameInput === "abc" && passwordInput === "abc") {
        errorDiv.style.display = 'none'; 
        
        dropdownContent.innerHTML = `
          <div class="text-center mb-3">
            <span class="badge bg-success-subtle text-success border border-success-subtle px-3 py-1.5 rounded-pill small fw-bold">Authorized</span>
          </div>
          <h6 class="text-dark fw-bold border-bottom pb-2 mb-3 small">Console Hub Links</h6>
          <div class="d-grid gap-2">
            <a class="btn btn-outline-primary btn-sm text-start d-flex justify-content-between align-items-center py-2 px-3 border" href="/assets/img/admin.html">
              <span>🖥️ Management Console</span> ➡️
            </a>
            <a class="btn btn-outline-secondary btn-sm text-start d-flex justify-content-between align-items-center py-2 px-3 border" href="https://www.godaddy.com" target="_blank">
              <span>🏷️ GoDaddy DNS</span> ➡️
            </a>
            <a class="btn btn-outline-secondary btn-sm text-start d-flex justify-content-between align-items-center py-2 px-3 border" href="/assets/img/certificate/cert-editor.html" target="_blank">
              <span>🎖️ / 🎗️Print Certificates</span> ➡️
            </a>
            <a class="btn btn-outline-secondary btn-sm text-start d-flex justify-content-between align-items-center py-2 px-3 border" href="/assets/img/certificate/Reviewer Details.html" target="_blank">
              <span>Update Reviewer Details</span> ➡️
            </a>
            <button class="btn btn-danger btn-sm fw-bold mt-3 py-2 shadow-sm rounded" onclick="logoutAdmin();">
              🔒 Sign Out
            </button>
          </div>
        `;
      } else {
        errorDiv.style.display = 'block';
        document.getElementById('adminAuthPwd').value = ''; 
      }
    }

    // Reset back into the initial double field form input
    function logoutAdmin() {
      const dropdownContent = document.getElementById('adminDropdownContent');
      dropdownContent.innerHTML = `
        <form onsubmit="event.preventDefault(); verifyAdminContent();">
          <div class="mb-3">
            <label for="adminAuthUser" class="form-label small fw-bold text-secondary mb-1">Username</label>
            <input type="text" class="form-control form-control-custom w-100" id="adminAuthUser" placeholder="Enter Username" required>
          </div>
          <div class="mb-4">
            <label for="adminAuthPwd" class="form-label small fw-bold text-secondary mb-1">Password</label>
            <input type="password" class="form-control form-control-custom w-100" id="adminAuthPwd" placeholder="Enter Password" required>
            <div id="adminAuthError" class="text-danger small fw-semibold mt-2" style="display: none;">❌ Invalid Username or Password</div>
          </div>
          <button type="submit" class="btn btn-google-primary w-100 fw-bold shadow-sm">Next</button>
        </form>
      `;
    }
  </script>
</body>
</html>
